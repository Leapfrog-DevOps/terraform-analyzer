name: Terraform Cost Analyzer

on:
  workflow_call:
    inputs:
      source_run_id:
        description: 'Source workflow run ID (find it in the URL of the completed workflow)'
        required: true
        type: string
      source_repository:
        description: 'Source repository (leave blank for current repo)'
        required: false
        default: ''
        type: string
      aws-region:
        description: 'AWS Region'
        required: true
        type: string
      environment:
        description: 'Environment name'
        required: true
        type: string
      deploy-lambda:
        description: 'Deploy Lambda flag'
        required: true
        type: string


permissions:
  id-token: write
  contents: write
  actions: read
  pull-requests: write

jobs:
  terraform:
    name: Terraform Cost Analyzer
    runs-on: ubuntu-latest

    env:
      TF_VERSION: ${{ inputs.terraform-version || '1.11.4' }}
      AWS_REGION: ${{ inputs.aws-region || vars.AWS_REGION }}
      ENVIRONMENT: ${{ inputs.environment || vars.ENVIRONMENT }}
      DEPLOY_LAMBDA: ${{ inputs.deploy-lambda || vars.DEPLOY_LAMBDA }}
      TF_IN_AUTOMATION: "true"
      TERM: xterm-256color

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Show input parameters
        run: |
          echo "🔍 Workflow Parameters:"
          echo "Source Run ID: ${{ github.event.inputs.source_run_id }}"
          echo "Source Repository: ${{ github.event.inputs.source_repository || github.repository }}"
          echo "Current Repository: ${{ github.repository }}"

      - name: Download tfplan artifact from source repo
        id: download_tfplan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_id="${{ inputs.source_run_id }}"
          repo="${{ inputs.source_repository || github.repository }}"
          artifact_name="tfplan.json"

          echo "🔍 Checking for artifact '$artifact_name' in $repo (run $run_id)..."
          artifact_id=$(gh api "repos/$repo/actions/runs/$run_id/artifacts" \
            --jq ".artifacts[] | select(.name==\"$artifact_name\") | .id" || true)

          if [ -z "$artifact_id" ]; then
            echo "⚠️ No tfplan.json artifact found. Skipping cost analysis."
            echo "skip_cost=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "✅ Artifact found (ID: $artifact_id). Downloading..."
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/$repo/actions/artifacts/$artifact_id/zip" > tfplan.zip
          unzip tfplan.zip
          echo "skip_cost=false" >> "$GITHUB_OUTPUT"

      - name: Verify artifacts
        if: steps.download_tfplan.outputs.skip_cost != 'true'
        run: |
          echo "📦 Downloaded artifacts:"
          ls -la
          if [ -f "tfplan.json" ]; then
            echo "✅ tfplan.json artifact found"
          else
            echo "❌ tfplan.json artifact not found"
            exit 1
          fi

      - name: Install OpenInfraQuote
        if: steps.download_tfplan.outputs.skip_cost != 'true'
        run: |
          LATEST_VERSION=$(curl -s https://api.github.com/repos/terrateamio/openinfraquote/releases/latest | grep -o '"tag_name": ".*"' | cut -d'"' -f4)
          echo "Installing OpenInfraQuote version $LATEST_VERSION"
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ]; then
            ARCH="amd64"
          elif [ "$ARCH" = "arm64" ] || [ "$ARCH" = "aarch64" ]; then
            ARCH="arm64"
          else
            echo "Unsupported architecture: $ARCH"
            exit 1
          fi
          curl -L "https://github.com/terrateamio/openinfraquote/releases/download/${LATEST_VERSION}/oiq-linux-${ARCH}-${LATEST_VERSION}.tar.gz" -o "oiq.tar.gz"
          tar -xzf oiq.tar.gz
          chmod +x oiq
          sudo mv oiq /usr/local/bin/

      - name: Download Price Sheet
        if: steps.download_tfplan.outputs.skip_cost != 'true'
        run: |
          curl -s https://oiq.terrateam.io/prices.csv.gz | gunzip > prices.csv

      - name: Run Infraquote
        run: |
          oiq match --pricesheet prices.csv tfplan.json | oiq price --region $AWS_REGION