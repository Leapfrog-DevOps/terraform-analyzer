name: 'Terraform AI and Cost Analyzer'
description: 'Analyze Terraform errors with AI and automatically fix common issues'
author: 'terraform-analyzer'
branding:
  icon: 'check-square'
  color: 'purple'

inputs:
  terraform-directory:
    description: 'Directory containing Terraform files'
    required: false
    default: './terraform'
  openai-api-key:
    description: 'OpenAI API key for AI analysis'
    required: true
  github-token:
    description: 'GitHub token for creating PRs'
    required: true
  auto-fix:
    description: 'Automatically apply fixes and create PR'
    required: false
    default: 'true'
  branch-name:
    description: 'Branch name for auto-fixes'
    required: false
    default: 'auto-tf-fix'
  mode:
    description: 'Action mode: analyze (for errors) or cost (for successful plans)'
    required: false
    default: 'analyze'
#  infracost-api-key:
#    description: 'Infracost API key (required when mode=cost)'
#    required: false
#  infracost-branch:
#    description: 'Branch name for storing infracost data'
#    required: false
#    default: 'infracost'


outputs:
  fixes-applied:
    description: 'Number of fixes applied'
  analysis-summary:
    description: 'AI analysis summary'
  cost-breakdown:
    description: 'Cost analysis results'


runs:
  using: 'composite'
  steps:
    - name: Setup Python
      if: inputs.mode == 'analyze'
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      if: inputs.mode == 'analyze'
      shell: bash
      run: |
        pip install openai python-hcl2

    - name: Copy analyzer script
      if: inputs.mode == 'analyze'
      shell: bash
      run: |
        cp ${{ github.action_path }}/terraform-analyzer.py ./terraform-analyzer.py
        chmod +x ./terraform-analyzer.py

    - name: Run Terraform analyzer
      if: inputs.mode == 'analyze'
      shell: bash
      env:
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        CODE_PATH: ${{ inputs.terraform-directory }}
        AUTO_FIX: ${{ inputs.auto-fix }}
        BRANCH_NAME: ${{ inputs.branch-name }}
      run: |
        mkdir -p logs
        if [ -f terraform.log ]; then
          cp terraform.log logs/terraform.log
        fi
        python terraform-analyzer.py

    - name: Install OpenInfraQuote
      if: inputs.mode == 'cost'
      shell: bash
      run: |
        cd ${{ inputs.terraform-directory }}
        curl -s https://oiq.terrateam.io/prices.csv.gz | gunzip > prices.csv
        LATEST_VERSION=$(curl -s https://api.github.com/repos/terrateamio/openinfraquote/releases/latest | grep -o '"tag_name": ".*"' | cut -d'"' -f4)
        echo "Installing OpenInfraQuote version $LATEST_VERSION"
        ARCH=$(uname -m)
        if [ "$ARCH" = "x86_64" ]; then
          ARCH="amd64"
        elif [ "$ARCH" = "arm64" ] || [ "$ARCH" = "aarch64" ]; then
          ARCH="arm64"
        else
          echo "Unsupported architecture: $ARCH"
          exit 1
        fi
        curl -L "https://github.com/terrateamio/openinfraquote/releases/download/${LATEST_VERSION}/oiq-linux-${ARCH}-${LATEST_VERSION}.tar.gz" -o "oiq.tar.gz"
        tar -xzf oiq.tar.gz
        chmod +x oiq
        sudo mv oiq /usr/local/bin/

    - name: Run Infraquote
      shell: bash
      run: |
        cd ${{ inputs.terraform-directory }}
        oiq match --pricesheet prices.csv tfplan.json | oiq price --region $AWS_REGION >> $GITHUB_STEP_SUMMARY

